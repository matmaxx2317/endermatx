<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>endermatx</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

body {
background: #2a2a2a;
color: #e0e0e0;
font-family: ‘Courier New’, Courier, monospace;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 40px 20px;
}

header {
text-align: center;
margin-bottom: 60px;
}

.title-row {
display: flex;
align-items: center;
justify-content: center;
gap: 14px;
margin-bottom: 8px;
}

header h1 {
font-size: 2rem;
font-weight: normal;
letter-spacing: 0.15em;
color: #ffffff;
text-transform: lowercase;
}

header p {
font-size: 0.75rem;
color: #ccc;
letter-spacing: 0.2em;
text-transform: uppercase;
}

/* ENDERMAN HEAD */
.enderman-head {
width: 36px;
height: 36px;
background: linear-gradient(145deg, #1c1c1c 0%, #0e0e0e 60%, #181818 100%);
border-radius: 4px;
position: relative;
flex-shrink: 0;
cursor: default;
animation: ender-idle 5s ease-in-out infinite;
box-shadow: 0 2px 8px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
}

.ender-eye {
position: absolute;
width: 6px;
height: 9px;
background: #cc00ee;
border-radius: 2px;
top: 12px;
box-shadow: 0 0 5px #cc00ee, 0 0 10px #9900bb, 0 0 18px #660088;
transition: background 0.15s, box-shadow 0.15s;
}
.ender-eye.left  { left: 6px; }
.ender-eye.right { right: 6px; }

.enderman-head.staring .ender-eye {
background: #ee44ff;
box-shadow: 0 0 8px #ee44ff, 0 0 18px #cc00ee, 0 0 30px #9900bb;
}

.enderman-head.twitching {
animation: ender-twitch 0.25s ease-in-out !important;
}

@keyframes ender-idle {
0%   { transform: translateY(0)    rotate(0deg); }
12%  { transform: translateY(-2px) rotate(-2deg); }
25%  { transform: translateY(0)    rotate(0deg); }
38%  { transform: translateY(1px)  rotate(1.5deg); }
50%  { transform: translateY(0)    rotate(0deg); }
63%  { transform: translateY(-1px) rotate(-1.5deg); }
78%  { transform: translateY(1px)  rotate(2deg); }
90%  { transform: translateY(0)    rotate(-0.5deg); }
100% { transform: translateY(0)    rotate(0deg); }
}

@keyframes ender-twitch {
0%   { transform: rotate(0deg)   translateX(0); }
20%  { transform: rotate(-9deg)  translateX(-3px); }
50%  { transform: rotate(9deg)   translateX(3px); }
75%  { transform: rotate(-4deg)  translateX(-1px); }
100% { transform: rotate(0deg)   translateX(0); }
}

@keyframes ender-bg-flash {
0%   { background: #2a2a2a; }
12%  { background: #3b1550; }
28%  { background: #2a2a2a; }
45%  { background: #331248; }
65%  { background: #2a2a2a; }
82%  { background: #2e1040; }
100% { background: #2a2a2a; }
}

body.ender-focused {
animation: ender-bg-flash 1.4s ease-out forwards;
}

.grid {
display: flex;
flex-direction: column;
gap: 8px;
width: 300px;
}

a.card {
display: flex;
flex-direction: row;
align-items: center;
text-decoration: none;
padding: 12px 16px;
border: 1px solid #2a2a2a;
border-left: 2px solid #6b1010;
background: #1e1e1e;
color: #e0e0e0;
transition: border-color 0.15s, background 0.15s;
}

a.card:hover {
border-color: #ccc;
border-left-color: #9b1a1a;
background: #222;
}

a.card:active {
background: #252525;
}

.card-label {
font-size: 0.65rem;
letter-spacing: 0.2em;
text-transform: uppercase;
color: #ccc;
width: 28px;
flex-shrink: 0;
}

.card-name {
font-size: 1rem;
font-weight: normal;
letter-spacing: 0.05em;
color: #ffffff;
flex: 1;
margin-left: 16px;
}

.card-arrow {
font-size: 0.7rem;
color: #ccc;
letter-spacing: 0.05em;
}

a.card:hover .card-arrow {
color: #bbb;
}

footer {
margin-top: 60px;
font-size: 0.65rem;
color: #bbb;
letter-spacing: 0.2em;
text-align: center;
}
</style>

</head>
<body>

<header>
  <div class="title-row">
    <div class="enderman-head" id="endermanHead">
      <div class="ender-eye left"></div>
      <div class="ender-eye right"></div>
    </div>
    <h1>endermatx</h1>
  </div>
  <p>tools</p>
</header>

<nav class="grid">

  <a class="card" href="./tts/">
    <div class="card-label">01</div>
    <div class="card-name">tts</div>
    <div class="card-arrow">time tracker &rarr;</div>
  </a>

  <a class="card" href="./cal/">
    <div class="card-label">02</div>
    <div class="card-name">cal</div>
    <div class="card-arrow">calendar &rarr;</div>
  </a>

  <a class="card" href="./pom/">
    <div class="card-label">03</div>
    <div class="card-name">pom</div>
    <div class="card-arrow">pomodoro &rarr;</div>
  </a>

  <a class="card" href="./mtg/">
    <div class="card-label">04</div>
    <div class="card-name">mtg</div>
    <div class="card-arrow">meeting notes &rarr;</div>
  </a>

  <a class="card" href="./str/">
    <div class="card-label">05</div>
    <div class="card-name">str</div>
    <div class="card-arrow">string tracker &rarr;</div>
  </a>

</nav>

<a id="deploy-link" href="https://github.com/matmaxx2317/endermatx/actions/workflows/pages/pages-build-deployment" target="_blank" style="display:inline-block; margin-top:40px; text-decoration:none;">
  <span id="deploy-dot" style="display:inline-block; width:7px; height:7px; border-radius:50%; background:#333; margin-right:7px; vertical-align:middle;"></span><span id="deploy-label" style="font-family:'Courier New',Courier,monospace; font-size:0.65rem; letter-spacing:0.2em; text-transform:uppercase; color: #bbb;">checking</span>
</a>

<footer>matmaxx2317 &middot; github pages</footer>

<script>
(function() {
  var dot = document.getElementById('deploy-dot');
  var label = document.getElementById('deploy-label');
  var pulse;

  function setStatus(status, conclusion) {
    clearInterval(pulse);
    if (status === 'in_progress' || status === 'queued') {
      label.textContent = 'deploying';
      label.style.color = '#aaa';
      dot.style.background = '#aaa';
      var on = true;
      pulse = setInterval(function() {
        dot.style.opacity = on ? '0.2' : '1';
        on = !on;
      }, 500);
    } else if (status === 'completed' && conclusion === 'success') {
      label.textContent = 'deployed';
      label.style.color = '#4a4a4a';
      dot.style.background = '#2d6a2d';
      dot.style.opacity = '1';
    } else if (status === 'completed') {
      label.textContent = 'failed';
      label.style.color = '#4a4a4a';
      dot.style.background = '#8b1a1a';
      dot.style.opacity = '1';
    } else {
      label.textContent = 'unknown';
      label.style.color = '#333';
      dot.style.background = '#333';
      dot.style.opacity = '1';
    }
  }

  function poll() {
    fetch('https://api.github.com/repos/matmaxx2317/endermatx/actions/runs?per_page=1')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var run = data.workflow_runs && data.workflow_runs[0];
        if (run) setStatus(run.status, run.conclusion);
      })
      .catch(function() {
        label.textContent = 'offline';
        label.style.color = '#333';
      });
  }

  poll();
  setInterval(poll, 5000);
})();

(function() {
  var head = document.getElementById('endermanHead');

  function triggerStare() {
    head.classList.add('staring');
    document.body.classList.remove('ender-focused');
    void document.body.offsetWidth;
    document.body.classList.add('ender-focused');
  }

  function releaseStare() {
    head.classList.remove('staring');
  }

  head.addEventListener('mouseenter', triggerStare);
  head.addEventListener('mouseleave', releaseStare);
  head.addEventListener('touchstart', function(e) {
    e.preventDefault();
    triggerStare();
    setTimeout(releaseStare, 1400);
  }, { passive: false });

  setInterval(function() {
    if (Math.random() < 0.35) {
      head.classList.add('twitching');
      setTimeout(function() { head.classList.remove('twitching'); }, 260);
    }
  }, 3200);
})();
</script>

</body>
</html>
