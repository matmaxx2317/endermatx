<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>endermatx</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

body {
background: #0d0d0d;
color: #e0e0e0;
font-family: ‘Courier New’, Courier, monospace;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 40px 20px;
}

header {
text-align: center;
margin-bottom: 60px;
}

header h1 {
font-size: 2rem;
font-weight: normal;
letter-spacing: 0.15em;
color: #ffffff;
text-transform: lowercase;
}

header p {
margin-top: 8px;
font-size: 0.75rem;
color: #999;
letter-spacing: 0.2em;
text-transform: uppercase;
}

.grid {
display: grid;
grid-template-columns: 220px 220px;
gap: 24px;
}

a.card {
display: flex;
flex-direction: column;
align-items: center;
text-align: center;
text-decoration: none;
width: 220px;
padding: 32px 24px;
border: 1px solid #2a2a2a;
border-top: 2px solid #6b1010;
background: #131313;
color: #e0e0e0;
transition: border-color 0.15s, background 0.15s;
}

a.card:hover {
border-color: #999;
border-top-color: #9b1a1a;
background: #1a1a1a;
}

a.card:active {
background: #1f1f1f;
}

.card-label {
font-size: 0.65rem;
letter-spacing: 0.25em;
text-transform: uppercase;
color: #999;
margin-bottom: 12px;
}

.card-name {
font-size: 1.4rem;
font-weight: normal;
letter-spacing: 0.05em;
color: #ffffff;
}

.card-arrow {
margin-top: 24px;
font-size: 0.75rem;
color: #999;
letter-spacing: 0.1em;
}

a.card:hover .card-arrow {
color: #888;
}

footer {
margin-top: 60px;
font-size: 0.65rem;
color: #888;
letter-spacing: 0.2em;
text-align: center;
}
</style>

</head>
<body>

<header>
  <h1>endermatx</h1>
  <p>tools</p>
</header>

<nav class="grid">

  <a class="card" href="./tts/">
    <div class="card-label">01</div>
    <div class="card-name">tts</div>
    <div class="card-arrow">time tracker &rarr;</div>
  </a>

  <a class="card" href="./cal/">
    <div class="card-label">02</div>
    <div class="card-name">cal</div>
    <div class="card-arrow">calendar &rarr;</div>
  </a>

  <a class="card" href="./pom/">
    <div class="card-label">03</div>
    <div class="card-name">pom</div>
    <div class="card-arrow">pomodoro &rarr;</div>
  </a>

  <a class="card" href="./mtg/">
    <div class="card-label">04</div>
    <div class="card-name">mtg</div>
    <div class="card-arrow">meeting notes &rarr;</div>
  </a>

  <a class="card" href="./str/">
    <div class="card-label">05</div>
    <div class="card-name">str</div>
    <div class="card-arrow">string tracker &rarr;</div>
  </a>

</nav>

<a id="deploy-link" href="https://github.com/matmaxx2317/endermatx/actions/workflows/pages/pages-build-deployment" target="_blank" style="display:inline-block; margin-top:40px; text-decoration:none;">
  <span id="deploy-dot" style="display:inline-block; width:7px; height:7px; border-radius:50%; background:#333; margin-right:7px; vertical-align:middle;"></span><span id="deploy-label" style="font-family:'Courier New',Courier,monospace; font-size:0.65rem; letter-spacing:0.2em; text-transform:uppercase; color: #888;">checking</span>
</a>

<footer>matmaxx2317 &middot; github pages</footer>

<script>
(function() {
  var dot = document.getElementById('deploy-dot');
  var label = document.getElementById('deploy-label');
  var pulse;

  function setStatus(status, conclusion) {
    clearInterval(pulse);
    if (status === 'in_progress' || status === 'queued') {
      label.textContent = 'deploying';
      label.style.color = '#aaa';
      dot.style.background = '#aaa';
      var on = true;
      pulse = setInterval(function() {
        dot.style.opacity = on ? '0.2' : '1';
        on = !on;
      }, 500);
    } else if (status === 'completed' && conclusion === 'success') {
      label.textContent = 'deployed';
      label.style.color = '#4a4a4a';
      dot.style.background = '#2d6a2d';
      dot.style.opacity = '1';
    } else if (status === 'completed') {
      label.textContent = 'failed';
      label.style.color = '#4a4a4a';
      dot.style.background = '#8b1a1a';
      dot.style.opacity = '1';
    } else {
      label.textContent = 'unknown';
      label.style.color = '#333';
      dot.style.background = '#333';
      dot.style.opacity = '1';
    }
  }

  function poll() {
    fetch('https://api.github.com/repos/matmaxx2317/endermatx/actions/runs?per_page=1')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var run = data.workflow_runs && data.workflow_runs[0];
        if (run) setStatus(run.status, run.conclusion);
      })
      .catch(function() {
        label.textContent = 'offline';
        label.style.color = '#333';
      });
  }

  poll();
  setInterval(poll, 5000);
})();
</script>

</body>
</html>
