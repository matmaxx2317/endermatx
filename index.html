<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>endermatx</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

body {
background: #2a2a2a;
color: #e0e0e0;
font-family: 'Courier New', Courier, monospace;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 40px 20px;
}

header {
text-align: center;
margin-bottom: 60px;
}

header h1 {
font-size: 2rem;
font-weight: normal;
letter-spacing: 0.15em;
color: #ffffff;
text-transform: uppercase;
font-family: 'Courier New', Courier, monospace;
line-height: 1.15;
}

header p {
margin-top: 8px;
font-size: 0.75rem;
color: #ccc;
letter-spacing: 0.2em;
text-transform: uppercase;
}

.grid {
display: flex;
flex-direction: column;
gap: 8px;
width: 300px;
}

a.card {
display: flex;
flex-direction: row;
align-items: center;
text-decoration: none;
padding: 12px 16px;
border: 1px solid #2a2a2a;
border-left: 2px solid #6b1010;
background: #1e1e1e;
color: #e0e0e0;
transition: border-color 0.15s, background 0.15s;
}

a.card:hover {
border-color: #ccc;
border-left-color: #9b1a1a;
background: #222;
}

a.card:active {
background: #252525;
}

.card-label {
font-size: 0.65rem;
letter-spacing: 0.2em;
text-transform: uppercase;
color: #ccc;
width: 28px;
flex-shrink: 0;
}

.card-name {
font-size: 1rem;
font-weight: normal;
letter-spacing: 0.05em;
color: #ffffff;
flex: 1;
margin-left: 16px;
}

.card-arrow {
font-size: 0.7rem;
color: #ccc;
letter-spacing: 0.05em;
}

a.card:hover .card-arrow {
color: #bbb;
}

footer {
margin-top: 60px;
font-size: 0.65rem;
color: #bbb;
letter-spacing: 0.2em;
text-align: center;
}

/* ── ENDERMAN ───────────────────────────────────── */

#enderman {
position: fixed;
top: 0;
left: 0;
z-index: 5;
pointer-events: none;
}

.ender-flip {
/* scaleX toggled by JS for direction */
}

.ender-figure {
display: flex;
flex-direction: column;
align-items: center;
animation: ender-bob 0.7s ease-in-out infinite;
}

.ender-head {
width: 11px;
height: 11px;
background: linear-gradient(150deg, #1e1e1e 0%, #0c0c0c 100%);
border-radius: 2px;
position: relative;
box-shadow: 0 1px 5px rgba(0,0,0,0.9);
flex-shrink: 0;
}

.ender-eye {
position: absolute;
width: 2px;
height: 4px;
background: #cc00ee;
top: 3px;
border-radius: 1px;
box-shadow: 0 0 4px #cc00ee, 0 0 8px #9900bb;
}
.ender-eye.left  { left: 1px; }
.ender-eye.right { right: 1px; }

.ender-body-wrap {
display: flex;
align-items: flex-start;
margin-top: 1px;
}

.ender-column {
display: flex;
flex-direction: column;
align-items: center;
}

.ender-torso {
width: 8px;
height: 14px;
background: linear-gradient(160deg, #2a2a2a 0%, #1a1a1a 40%, #111 100%);
border-left: 1px solid #333;
border-right: 1px solid #333;
box-shadow: inset 1px 0 0 rgba(255,255,255,0.04);
}

.ender-arm {
width: 2px;
height: 28px;
background: linear-gradient(180deg, #151515, #0a0a0a);
border-radius: 1px;
transform-origin: top center;
}
.ender-arm.left  { animation: ender-arm-l 0.7s ease-in-out infinite; }
.ender-arm.right { animation: ender-arm-r 0.7s ease-in-out infinite; }

.ender-legs {
display: flex;
gap: 1px;
margin-top: 0;
}

.ender-leg {
width: 2px;
height: 30px;
background: linear-gradient(180deg, #111, #080808);
border-radius: 1px;
transform-origin: top center;
}
.ender-leg.left  { animation: ender-leg-l 0.7s ease-in-out infinite; }
.ender-leg.right { animation: ender-leg-r 0.7s ease-in-out infinite; }

@keyframes ender-bob {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(-2px); }
}
@keyframes ender-arm-l {
  0%, 100% { transform: rotate(-13deg); }
  50%       { transform: rotate(13deg); }
}
@keyframes ender-arm-r {
  0%, 100% { transform: rotate(13deg); }
  50%       { transform: rotate(-13deg); }
}
@keyframes ender-leg-l {
  0%, 100% { transform: rotate(-24deg); }
  50%       { transform: rotate(24deg); }
}
@keyframes ender-leg-r {
  0%, 100% { transform: rotate(24deg); }
  50%       { transform: rotate(-24deg); }
}

</style>

</head>
<body>

<!-- ENDERMAN -->
<div id="enderman">
  <div class="ender-flip" id="enderFlip">
    <div class="ender-figure">
      <div class="ender-head">
        <div class="ender-eye left"></div>
        <div class="ender-eye right"></div>
      </div>
      <div class="ender-body-wrap">
        <div class="ender-arm left"></div>
        <div class="ender-column">
          <div class="ender-torso"></div>
          <div class="ender-legs">
            <div class="ender-leg left"></div>
            <div class="ender-leg right"></div>
          </div>
        </div>
        <div class="ender-arm right"></div>
      </div>
    </div>
  </div>
</div>

<header>
  <h1>END<br>ERM<br>ATX</h1>
  <p>tools</p>
</header>

<nav class="grid">

  <a class="card" href="./tts/">
    <div class="card-label">01</div>
    <div class="card-name">tts</div>
    <div class="card-arrow">time tracker &rarr;</div>
  </a>

  <a class="card" href="./cal/">
    <div class="card-label">02</div>
    <div class="card-name">cal</div>
    <div class="card-arrow">calendar &rarr;</div>
  </a>

  <a class="card" href="./pom/">
    <div class="card-label">03</div>
    <div class="card-name">pom</div>
    <div class="card-arrow">pomodoro &rarr;</div>
  </a>

  <a class="card" href="./mtg/">
    <div class="card-label">04</div>
    <div class="card-name">mtg</div>
    <div class="card-arrow">meeting notes &rarr;</div>
  </a>

  <a class="card" href="./str/">
    <div class="card-label">05</div>
    <div class="card-name">str</div>
    <div class="card-arrow">string tracker &rarr;</div>
  </a>

  <a class="card" href="./crd/">
    <div class="card-label">06</div>
    <div class="card-name">crd</div>
    <div class="card-arrow">chord aligner &rarr;</div>
  </a>

</nav>

<a id="deploy-link" href="https://github.com/matmaxx2317/endermatx/actions/workflows/pages/pages-build-deployment" target="_blank" style="display:inline-block; margin-top:40px; text-decoration:none;">
  <span id="deploy-dot" style="display:inline-block; width:7px; height:7px; border-radius:50%; background:#333; margin-right:7px; vertical-align:middle;"></span><span id="deploy-label" style="font-family:'Courier New',Courier,monospace; font-size:0.65rem; letter-spacing:0.2em; text-transform:uppercase; color: #bbb;">checking</span>
</a>

<footer>matmaxx2317 &middot; github pages</footer>

<script>
(function() {
  var dot = document.getElementById('deploy-dot');
  var label = document.getElementById('deploy-label');
  var pulse;

  function setStatus(status, conclusion) {
    clearInterval(pulse);
    if (status === 'in_progress' || status === 'queued') {
      label.textContent = 'deploying';
      label.style.color = '#aaa';
      dot.style.background = '#aaa';
      var on = true;
      pulse = setInterval(function() {
        dot.style.opacity = on ? '0.2' : '1';
        on = !on;
      }, 500);
    } else if (status === 'completed' && conclusion === 'success') {
      label.textContent = 'deployed';
      label.style.color = '#4a4a4a';
      dot.style.background = '#2d6a2d';
      dot.style.opacity = '1';
    } else if (status === 'completed') {
      label.textContent = 'failed';
      label.style.color = '#4a4a4a';
      dot.style.background = '#8b1a1a';
      dot.style.opacity = '1';
    } else {
      label.textContent = 'unknown';
      label.style.color = '#333';
      dot.style.background = '#333';
      dot.style.opacity = '1';
    }
  }

  function poll() {
    fetch('https://api.github.com/repos/matmaxx2317/endermatx/actions/runs?per_page=1')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var run = data.workflow_runs && data.workflow_runs[0];
        if (run) setStatus(run.status, run.conclusion);
      })
      .catch(function() {
        label.textContent = 'offline';
        label.style.color = '#333';
      });
  }

  poll();
  setInterval(poll, 5000);
})();

(function() {
  var ENDER_W = 14;
  var ENDER_H = 70;
  var SPEED   = 52; // px per second

  var enderman = document.getElementById('enderman');
  var flip     = document.getElementById('enderFlip');

  var x              = 20;
  var dir            = 1;
  var teleporting    = false;
  var last           = null;
  var sinceLastTport = 0;
  var nextTport      = randomInterval();

  var currentSpeed   = 30;
  var targetSpeed    = 30;
  var sinceSpeedChange = 0;
  var nextSpeedChange  = randomSpeedInterval();

  function randomInterval() { return 2800 + Math.random() * 2400; }
  function randomSpeedInterval() { return 600 + Math.random() * 1400; }
  function randomTargetSpeed() {
    var r = Math.random();
    if (r < 0.2) return 0;           // pause
    if (r < 0.5) return 18 + Math.random() * 14;  // slow creep
    if (r < 0.85) return 45 + Math.random() * 25; // normal
    return 90 + Math.random() * 40;  // brief fast lurch
  }

  function positionV() {
    var rect = document.querySelector('header').getBoundingClientRect();
    var top  = rect.top + rect.height / 2 - ENDER_H / 2;
    enderman.style.top = Math.max(8, top) + 'px';
  }

  var PARTICLE_COLORS = ['#cc00ee','#dd44ff','#9900bb','#ee88ff','#aa00dd'];

  function spawnParticles(px, py, count) {
    for (var i = 0; i < count; i++) {
      (function() {
        var p    = document.createElement('div');
        var size = 2 + Math.random() * 2.5;
        var col  = PARTICLE_COLORS[Math.floor(Math.random() * PARTICLE_COLORS.length)];
        p.style.cssText = 'position:fixed;border-radius:50%;pointer-events:none;z-index:6;' +
          'width:' + size + 'px;height:' + size + 'px;' +
          'background:' + col + ';box-shadow:0 0 4px ' + col + ';';
        document.body.appendChild(p);

        var angle  = Math.random() * Math.PI * 2;
        var dist   = 18 + Math.random() * 55;
        var vx     = Math.cos(angle) * dist;
        var vy     = Math.sin(angle) * dist;
        var maxLife = 420 + Math.random() * 320;
        var t0 = null;

        function frame(ts) {
          if (!t0) t0 = ts;
          var t = (ts - t0) / maxLife;
          if (t >= 1) { p.remove(); return; }
          var e = 1 - (1 - t) * (1 - t);
          p.style.left    = (px + vx * e) + 'px';
          p.style.top     = (py + vy * e - 28 * t) + 'px';
          p.style.opacity = (1 - t).toFixed(3);
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();
    }
  }

  function enderPos() {
    return {
      px: x + ENDER_W / 2,
      py: parseFloat(enderman.style.top || 0) + ENDER_H / 2
    };
  }

  function teleport() {
    teleporting = true;
    var from = enderPos();
    spawnParticles(from.px, from.py, 14);
    enderman.style.opacity = '0';
    setTimeout(function() {
      var maxX = window.innerWidth - ENDER_W;
      x   = Math.random() * maxX;
      dir = Math.random() > 0.5 ? 1 : -1;
      enderman.style.transform = 'translateX(' + x + 'px)';
      flip.style.transform     = dir === -1 ? 'scaleX(-1)' : 'scaleX(1)';
      enderman.style.opacity   = '1';
      var to = enderPos();
      spawnParticles(to.px, to.py, 14);
      teleporting    = false;
      sinceLastTport = 0;
      nextTport      = randomInterval();
    }, 200);
  }

  function step(dt) {
    if (teleporting) return;
    sinceLastTport   += dt;
    sinceSpeedChange += dt;

    if (sinceSpeedChange >= nextSpeedChange) {
      targetSpeed      = randomTargetSpeed();
      nextSpeedChange  = randomSpeedInterval();
      sinceSpeedChange = 0;
    }

    currentSpeed += (targetSpeed - currentSpeed) * Math.min(1, dt / 180);

    x += dir * currentSpeed * (dt / 1000);
    var maxX = window.innerWidth - ENDER_W;
    if (x >= maxX) { x = maxX; dir = -1; flip.style.transform = 'scaleX(-1)'; }
    if (x <= 0)    { x = 0;    dir =  1; flip.style.transform = 'scaleX(1)';  }
    enderman.style.transform = 'translateX(' + x + 'px)';

    var walkDur = currentSpeed < 5 ? '9999s' : (1.4 - Math.min(currentSpeed, 130) / 130 * 0.9) + 's';
    enderman.querySelectorAll('.ender-arm, .ender-leg, .ender-figure').forEach(function(el) {
      el.style.animationDuration = walkDur;
    });

    if (sinceLastTport >= nextTport) teleport();
  }

  function loop(ts) {
    if (last !== null) step(ts - last);
    last = ts;
    requestAnimationFrame(loop);
  }

  positionV();
  enderman.style.transform = 'translateX(' + x + 'px)';
  window.addEventListener('resize', function() {
    positionV();
    x = Math.min(x, window.innerWidth - ENDER_W);
  });

  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
