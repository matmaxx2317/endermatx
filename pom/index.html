<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pom</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: #2a2a2a;
color: #e0e0e0;
font-family: ‘Courier New’, Courier, monospace;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 20px;
}

#syncBar {
position: fixed;
top: 0; left: 0; right: 0;
display: flex;
justify-content: space-between;
align-items: center;
padding: 6px 12px;
background: #111;
border-bottom: 1px solid #222;
font-size: 11px;
color: #ccc;
}

#syncStatus { display: flex; align-items: center; }
#syncBar .dot {
width: 7px; height: 7px;
border-radius: 50%;
display: inline-block;
margin-right: 5px;
background: #555;
}
#syncBar .dot.synced { background: #4caf50; }
#syncBar .dot.syncing { background: #ff9800; }
#syncBar .dot.error { background: #f44336; }

#setupBtn {
background: none; border: 1px solid #333;
color: #ccc; cursor: pointer; padding: 2px 8px;
font-family: ‘Courier New’, monospace; font-size: 11px;
border-radius: 2px;
}
#setupBtn:hover { color: #ccc; border-color: #ccc; }

/* SETUP MODAL */
.modal-overlay {
display: none;
position: fixed; inset: 0;
background: rgba(0,0,0,0.85);
z-index: 100;
align-items: center; justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
background: #111;
border: 1px solid #333;
padding: 24px;
width: 90%; max-width: 420px;
border-radius: 4px;
}
.modal h2 { font-size: 14px; color: #ccc; margin-bottom: 16px; letter-spacing: 2px; text-transform: uppercase; }
.modal label { display: block; color: #ccc; font-size: 11px; margin-bottom: 4px; margin-top: 12px; }
.modal input {
width: 100%; background: #2a2a2a;
border: 1px solid #333; color: #e0e0e0;
padding: 8px; font-family: ‘Courier New’, monospace; font-size: 13px;
border-radius: 2px;
}
.modal input:focus { outline: none; border-color: #ccc; }
.modal-btns { display: flex; gap: 8px; margin-top: 20px; }
.mbtn {
padding: 8px 16px; cursor: pointer;
font-family: ‘Courier New’, monospace; font-size: 13px;
border-radius: 2px; border: 1px solid #444;
}
.mbtn-primary { background: #e0e0e0; color: #0d0d0d; border-color: #e0e0e0; }
.mbtn-primary:hover { background: #fff; }
.mbtn-ghost { background: none; color: #ccc; }
.mbtn-ghost:hover { color: #ccc; }

/* MAIN */
#main {
display: flex;
flex-direction: column;
align-items: center;
gap: 32px;
width: 100%;
max-width: 480px;
}

#mode-label {
font-size: 11px;
letter-spacing: 0.2em;
color: #ccc;
text-transform: uppercase;
}

#timer {
font-size: clamp(64px, 18vw, 120px);
font-weight: normal;
letter-spacing: -0.02em;
color: #e0e0e0;
line-height: 1;
transition: color 0.5s;
}

#timer.break-mode { color: #4a7a4a; }

#message {
font-size: 13px;
color: #ccc;
text-align: center;
min-height: 20px;
max-width: 320px;
line-height: 1.5;
transition: opacity 0.3s;
font-style: italic;
}

#controls {
display: flex;
gap: 16px;
}

button {
background: none;
border: 1px solid #2a2a2a;
color: #bbb;
font-family: ‘Courier New’, Courier, monospace;
font-size: 12px;
letter-spacing: 0.1em;
padding: 10px 24px;
cursor: pointer;
text-transform: uppercase;
transition: border-color 0.2s, color 0.2s;
}

button:hover { border-color: #ccc; color: #ccc; }
button:active { border-color: #bbb; }

button.primary {
border-color: #bbb;
color: #ccc;
}

button.primary:hover { border-color: #bbb; color: #fff; }

#stats {
width: 100%;
border-top: 1px solid #1a1a1a;
padding-top: 24px;
display: grid;
grid-template-columns: 1fr 1fr 1fr;
gap: 8px;
text-align: center;
}

.stat-block { display: flex; flex-direction: column; gap: 4px; }

.stat-value {
font-size: 28px;
color: #ccc;
line-height: 1;
}

.stat-label {
font-size: 10px;
color: #bbb;
letter-spacing: 0.15em;
text-transform: uppercase;
}

#progress-bar {
width: 100%;
height: 2px;
background: #222;
position: relative;
overflow: hidden;
}

#progress-fill {
height: 100%;
background: #3a3a3a;
transition: width 1s linear, background 0.5s;
width: 0%;
}

#progress-fill.break-mode { background: #3a5a3a; }
</style>

</head>
<body>

<!-- TOP BAR -->

<div id="syncBar">
  <span>pom</span>
  <div id="syncStatus"><span class="dot" id="syncDot"></span><span id="syncText">not connected</span></div>
  <button id="setupBtn">setup</button>
</div>

<!-- SETUP MODAL -->

<div class="modal-overlay" id="setupModal">
  <div class="modal">
    <h2>Sync Setup</h2>
    <label>GitHub Personal Access Token</label>
    <input type="password" id="input-token" placeholder="ghp_..." autocomplete="off">
    <label>Gist ID <span style="color: #ccc">(leave blank to create new)</span></label>
    <input type="text" id="input-gist" placeholder="optional">
    <div class="modal-btns">
      <button class="mbtn mbtn-primary" id="btn-connect">Save</button>
      <button class="mbtn mbtn-ghost" id="btn-cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- MAIN -->

<div id="main">
  <div style="font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:#bbb">pom<span style="letter-spacing:0.05em;text-transform:none;margin-left:6px">v1.0</span></div>
  <div id="mode-label">work</div>
  <div id="timer">25:00</div>
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <div id="message">whenever you're ready. no rush. it's fine.</div>
  <div id="controls">
    <button class="primary" id="btn-start">start</button>
    <button id="btn-reset">reset</button>
  </div>
  <div id="stats">
    <div class="stat-block">
      <div class="stat-value" id="stat-today">0</div>
      <div class="stat-label">today</div>
    </div>
    <div class="stat-block">
      <div class="stat-value" id="stat-streak">0</div>
      <div class="stat-label">streak</div>
    </div>
    <div class="stat-block">
      <div class="stat-value" id="stat-total">0</div>
      <div class="stat-label">total hrs</div>
    </div>
  </div>
</div>

<script>
var WORK_SECS = 25 * 60;
var BREAK_SECS = 5 * 60;
var TIMER_SAVE_EVERY = 60;

var MESSAGES = {
  idle: [
    "whenever you're ready. no rush. it's fine.",
    "the timer is just sitting here. patiently.",
    "take your time. it's not going anywhere.",
    "ready when you are. which, apparently, is not now."
  ],
  work_start: [
    "oh, we're actually doing this today.",
    "fine. 25 minutes. try not to check your phone.",
    "okay. let's see how long this lasts.",
    "starting now. you're welcome.",
    "alright. eyes on the work, please."
  ],
  work_mid: [
    "still going. honestly surprised.",
    "halfway. don't celebrate yet.",
    "you're doing it. mediocrely, but you're doing it.",
    "no, you cannot check instagram. keep going."
  ],
  work_resume: [
    "back again. fine.",
    "resuming. sure.",
    "oh, you remembered. interesting."
  ],
  work_paused: [
    "sure. take a break. the work will wait. it always does.",
    "paused. very on-brand.",
    "of course. this is fine.",
    "amazing. we were so close."
  ],
  work_done: [
    "fine. that was acceptable.",
    "session complete. you may feel slightly proud.",
    "done. see? you're capable of things.",
    "25 minutes of work. noted. reluctantly impressed.",
    "alright, that counted. well done, i suppose."
  ],
  break_start: [
    "don't get too comfortable.",
    "5 minutes. that's it.",
    "rest. but not too much.",
    "okay, fine. you've earned 5 minutes."
  ],
  break_done: [
    "break's over. back to it.",
    "hope that was refreshing. time to work.",
    "5 minutes are up. no more stalling.",
    "ready? doesn't matter. let's go."
  ],
  restored_work: [
    "oh, you're back. the timer waited.",
    "welcome back. it kept going without you.",
    "picked up where you left off. you're welcome."
  ],
  restored_break: [
    "still on your break, apparently.",
    "break's still running. don't milk it."
  ],
  streak: [
    "you've been doing this for {n} days. suspicious.",
    "{n} day streak. trying to impress someone?",
    "day {n}. alright, fine. commitment."
  ]
};

function pick(arr, vars) {
  var s = arr[Math.floor(Math.random() * arr.length)];
  if (vars) {
    var keys = Object.keys(vars);
    for (var i = 0; i < keys.length; i++) {
      s = s.replace('{' + keys[i] + '}', vars[keys[i]]);
    }
  }
  return s;
}

// State
var state = 'idle';
var secsLeft = WORK_SECS;
var totalSecs = WORK_SECS;
var interval = null;
var lastMidMsg = 0;
var ticksSinceTimerSave = 0;

// All persisted data in one object
var data = { sessions: {}, totalMins: 0, timer: null };

// DOM
var timerEl = document.getElementById('timer');
var modeEl = document.getElementById('mode-label');
var msgEl = document.getElementById('message');
var btnStart = document.getElementById('btn-start');
var btnReset = document.getElementById('btn-reset');
var progressFill = document.getElementById('progress-fill');
var syncDot = document.getElementById('syncDot');
var syncText = document.getElementById('syncText');
var statToday = document.getElementById('stat-today');
var statStreak = document.getElementById('stat-streak');
var statTotal = document.getElementById('stat-total');

// Credentials in localStorage only
var token = localStorage.getItem('pom_token') || '';
var gistId = localStorage.getItem('pom_gist_id') || '';
var isSaving = false;
var pendingSave = false;

// ---- Sync status ----

function setSyncState(s, msg) {
  syncDot.className = 'dot ' + (s === 'synced' ? 'synced' : s === 'syncing' ? 'syncing' : s === 'error' ? 'error' : '');
  syncText.textContent = msg || s;
}

// ---- Setup modal ----

document.getElementById('setupBtn').onclick = function() {
  document.getElementById('input-token').value = token;
  document.getElementById('input-gist').value = gistId;
  document.getElementById('setupModal').classList.add('active');
};

document.getElementById('btn-cancel').onclick = function() {
  document.getElementById('setupModal').classList.remove('active');
};

document.getElementById('btn-connect').onclick = async function() {
  var t = document.getElementById('input-token').value.trim();
  var g = document.getElementById('input-gist').value.trim();
  if (t) { token = t; localStorage.setItem('pom_token', token); }
  if (g) { gistId = g; localStorage.setItem('pom_gist_id', gistId); }
  document.getElementById('setupModal').classList.remove('active');
  if (token) {
    if (gistId) {
      await loadFromGist();
    } else {
      await createGist();
    }
  }
};

// ---- Display ----

function formatTime(s) {
  if (s < 0) s = 0;
  var m = Math.floor(s / 60);
  var sec = s % 60;
  return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}

function setMessage(msg) {
  msgEl.style.opacity = '0';
  setTimeout(function() { msgEl.textContent = msg; msgEl.style.opacity = '1'; }, 150);
}

function updateDisplay() {
  timerEl.textContent = formatTime(secsLeft);
  var pct = ((totalSecs - secsLeft) / totalSecs) * 100;
  progressFill.style.width = pct + '%';
  var isBreak = state === 'break';
  timerEl.className = isBreak ? 'break-mode' : '';
  progressFill.className = isBreak ? 'break-mode' : '';
}

function updateStats() {
  var today = todayKey();
  statToday.textContent = data.sessions[today] || 0;
  statStreak.textContent = calcStreak();
  statTotal.textContent = ((data.totalMins || 0) / 60).toFixed(1);
}

function todayKey() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function calcStreak() {
  var streak = 0;
  var d = new Date();
  while (true) {
    var key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    if (data.sessions[key]) { streak++; d.setDate(d.getDate() - 1); }
    else break;
  }
  return streak;
}

// ---- Gist sync ----

async function saveToGist() {
  if (!token || !gistId) return;
  if (isSaving) { pendingSave = true; return; }
  isSaving = true;
  setSyncState('syncing', 'saving...');
  try {
    var payload = JSON.stringify({ sessions: data.sessions, totalMins: data.totalMins, timer: data.timer });
    var res = await fetch('https://api.github.com/gists/' + gistId, {
      method: 'PATCH',
      headers: { Authorization: 'token ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: { 'pom_data.json': { content: payload } } })
    });
    if (!res.ok) throw new Error('save failed');
    setSyncState('synced', 'synced');
  } catch (e) {
    setSyncState('error', 'sync error');
  }
  isSaving = false;
  if (pendingSave) { pendingSave = false; saveToGist(); }
}

async function createGist() {
  setSyncState('syncing', 'creating...');
  var payload = JSON.stringify({ sessions: {}, totalMins: 0, timer: null });
  var res = await fetch('https://api.github.com/gists', {
    method: 'POST',
    headers: { Authorization: 'token ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ description: 'pom data', public: false, files: { 'pom_data.json': { content: payload } } })
  });
  if (!res.ok) throw new Error('create failed');
  var d = await res.json();
  gistId = d.id;
  localStorage.setItem('pom_gist_id', gistId);
  setSyncState('synced', 'synced');
}

async function loadFromGist() {
  if (!token || !gistId) return;
  setSyncState('syncing', 'syncing...');
  try {
    var res = await fetch('https://api.github.com/gists/' + gistId, {
      headers: { Authorization: 'token ' + token }
    });
    if (!res.ok) throw new Error('fetch failed');
    var json = await res.json();
    var file = json.files['pom_data.json'];
    if (file && file.content) {
      var parsed = JSON.parse(file.content);
      data.sessions = parsed.sessions || {};
      data.totalMins = parsed.totalMins || 0;
      data.timer = parsed.timer || null;
    }
    setSyncState('synced', 'synced');
    updateStats();
    restoreTimer();
  } catch (e) {
    setSyncState('error', 'sync error');
  }
}

// ---- Timer persistence ----

function saveTimerState() {
  if (!token || !gistId) return;
  data.timer = {
    state: state,
    secsLeft: secsLeft,
    totalSecs: totalSecs,
    lastMidMsg: lastMidMsg,
    savedAt: Date.now()
  };
  saveToGist();
}

function clearTimerState() {
  data.timer = null;
  saveToGist();
}

function restoreTimer() {
  var t = data.timer;
  if (!t || !t.state || t.state === 'idle') return;

  var restored = t.secsLeft;
  if (t.state === 'work' || t.state === 'break') {
    var elapsed = Math.floor((Date.now() - t.savedAt) / 1000);
    restored = t.secsLeft - elapsed;
  }

  if (t.state === 'work' && restored <= 0) {
    recordSession();
    setMessage(pick(MESSAGES.work_done));
    setTimeout(function() { startBreak(); }, 1500);
    return;
  }

  if (t.state === 'break' && restored <= 0) {
    setMessage(pick(MESSAGES.break_done));
    return;
  }

  state = t.state;
  secsLeft = restored;
  totalSecs = t.totalSecs;
  lastMidMsg = t.lastMidMsg || 0;

  if (state === 'work' || state === 'paused') {
    modeEl.textContent = 'work';
    btnStart.textContent = state === 'paused' ? 'resume' : 'pause';
    setMessage(state === 'paused' ? pick(MESSAGES.work_paused) : pick(MESSAGES.restored_work));
    if (state === 'work') startTick();
  } else if (state === 'break') {
    modeEl.textContent = 'break';
    btnStart.textContent = 'skip break';
    setMessage(pick(MESSAGES.restored_break));
    startTick();
  }

  updateDisplay();
}

// ---- Session ----

function recordSession() {
  var key = todayKey();
  data.sessions[key] = (data.sessions[key] || 0) + 1;
  data.totalMins = (data.totalMins || 0) + 25;
  updateStats();
}

// ---- Timer controls ----

function startWork() {
  state = 'work';
  secsLeft = WORK_SECS;
  totalSecs = WORK_SECS;
  lastMidMsg = 0;
  ticksSinceTimerSave = 0;
  modeEl.textContent = 'work';
  btnStart.textContent = 'pause';
  setMessage(pick(MESSAGES.work_start));
  updateDisplay();
  startTick();
  saveTimerState();
}

function startBreak() {
  state = 'break';
  secsLeft = BREAK_SECS;
  totalSecs = BREAK_SECS;
  ticksSinceTimerSave = 0;
  modeEl.textContent = 'break';
  btnStart.textContent = 'skip break';
  setMessage(pick(MESSAGES.break_start));
  updateDisplay();
  startTick();
  saveTimerState();
}

function goIdle() {
  state = 'idle';
  secsLeft = WORK_SECS;
  totalSecs = WORK_SECS;
  modeEl.textContent = 'work';
  btnStart.textContent = 'start';
  progressFill.style.width = '0%';
  timerEl.className = '';
  progressFill.className = '';
  updateDisplay();
}

function startTick() {
  clearInterval(interval);
  interval = setInterval(tick, 1000);
}

function tick() {
  secsLeft--;
  ticksSinceTimerSave++;
  updateDisplay();

  if (state === 'work' && secsLeft === Math.floor(WORK_SECS / 2) && lastMidMsg !== secsLeft) {
    lastMidMsg = secsLeft;
    setMessage(pick(MESSAGES.work_mid));
  }

  if (ticksSinceTimerSave >= TIMER_SAVE_EVERY) {
    ticksSinceTimerSave = 0;
    saveTimerState();
  }

  if (secsLeft <= 0) {
    clearInterval(interval);
    if (state === 'work') {
      recordSession();
      clearTimerState();
      var streak = calcStreak();
      if (streak > 1) {
        setMessage(pick(MESSAGES.streak, { n: streak }));
        setTimeout(function() { setMessage(pick(MESSAGES.work_done)); }, 2500);
      } else {
        setMessage(pick(MESSAGES.work_done));
      }
      setTimeout(function() { startBreak(); }, 3000);
    } else {
      clearTimerState();
      setMessage(pick(MESSAGES.break_done));
      goIdle();
    }
  }
}

// ---- Buttons ----

btnStart.addEventListener('click', function() {
  if (state === 'idle') {
    startWork();
  } else if (state === 'work') {
    clearInterval(interval);
    state = 'paused';
    btnStart.textContent = 'resume';
    setMessage(pick(MESSAGES.work_paused));
    saveTimerState();
  } else if (state === 'paused') {
    state = 'work';
    ticksSinceTimerSave = 0;
    btnStart.textContent = 'pause';
    setMessage(pick(MESSAGES.work_resume));
    startTick();
    saveTimerState();
  } else if (state === 'break') {
    clearInterval(interval);
    clearTimerState();
    setMessage(pick(MESSAGES.break_done));
    goIdle();
  }
});

btnReset.addEventListener('click', function() {
  clearInterval(interval);
  clearTimerState();
  setMessage(pick(MESSAGES.idle));
  goIdle();
});

// ---- Init ----

updateStats();
updateDisplay();
setMessage(pick(MESSAGES.idle));

if (token && gistId) {
  loadFromGist();
} else {
  setSyncState('idle', 'not connected');
}
</script>

</body>
</html>
