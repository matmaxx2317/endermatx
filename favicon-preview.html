<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><style>
  body { background: #2a2a2a; font-family: monospace; color: #bbb; padding: 40px; }
  .row { display: flex; align-items: center; gap: 24px; margin-bottom: 32px; }
  .label { width: 160px; font-size: 13px; letter-spacing: 0.1em; }
  .sizes { display: flex; align-items: center; gap: 24px; }
  svg { display: block; }
</style></head>
<body>

<div class="row">
  <div class="label">landing (enderman)</div>
  <div class="sizes">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="16" height="16">
      <rect width="32" height="32" fill="#1a1a1a"/>

      <rect x="18" y="14" width="9" height="3" fill="#cc00ee"/>
    </svg>
  </div>
</div>

      <circle cx="16" cy="20" r="1.5" fill="#7effa0"/>
    </svg>
  </div>
</div>

      <rect x="14" y="24" width="3" height="3" rx="0.5" fill="#7effa0" opacity="0.5"/>
    </svg>
