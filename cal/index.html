<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>
<style>
  :root {
    --bg: #2a2a2a;
    --surface: #333;
    --border: #3d3d3d;
    --text: #c8c8c8;
    --muted: #777;
    --accent: #ff6b35;
    --holiday: #5bb8f5;
    --tile-w: 360px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
background: var(–bg);
color: var(–text);
font-family: var(–font);
font-size: 13px;
min-height: 100vh;
}

header {
display: flex;
align-items: center;
gap: 20px;
flex-wrap: wrap;
padding: 14px 24px;
border-bottom: 1px solid var(–border);
position: sticky;
top: 0;
background: var(–bg);
z-index: 10;
}

.logo { font-size: 12px; font-weight: 600; color: var(–muted); letter-spacing: 0.12em; text-transform: uppercase; }

.ctrl-group { display: flex; align-items: center; gap: 6px; color: var(–muted); font-size: 12px; }

select, input[type=number] {
background: var(–surface);
border: 1px solid var(–border);
color: var(–text);
font-family: var(–font);
font-size: 12px;
padding: 4px 6px;
border-radius: 4px;
outline: none;
}

input[type=number] { width: 60px; }
input[type=range] { width: 72px; accent-color: var(–accent); cursor: pointer; }

.flag-btn {
background: none;
border: 1px solid var(–border);
color: var(–muted);
font-size: 11px;
padding: 3px 8px;
border-radius: 4px;
cursor: pointer;
font-family: var(–font);
}
.flag-btn.active { color: var(–text); border-color: #666; }
.country-flags { display: flex; gap: 4px; flex-wrap: wrap; }

main { padding: 28px 24px 60px; }

.year-section { margin-bottom: 36px; }

.year-label {
font-size: 11px;
font-weight: 600;
letter-spacing: 0.1em;
text-transform: uppercase;
color: var(–muted);
margin-bottom: 14px;
}

.months-row { display: flex; flex-wrap: wrap; gap: 12px; }
.month-tile { width: var(–tile-w); flex-shrink: 0; }

.month-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 8px;
padding-bottom: 6px;
border-bottom: 1px solid var(–border);
}

.month-name { font-size: 12px; font-weight: 600; color: var(–text); }
.month-num { font-size: 11px; color: var(–muted); }

/* 9 cols: week# + 7 days */
.day-grid {
display: grid;
grid-template-columns: 24px repeat(7, 1fr);
gap: 1px;
}

.cell {
display: flex;
align-items: center;
justify-content: center;
height: 26px;
font-size: 11px;
border-radius: 3px;
position: relative;
}

.hdr { font-size: 10px; color: var(–muted); font-weight: 500; }
.hdr.wk-hdr { color: #555; font-size: 9px; }

.week-num {
font-size: 9px;
color: #555;
border-right: 1px solid var(–border);
margin-right: 2px;
}

.day { cursor: default; }
.day.sat, .day.sun { color: var(–muted); }

/* TODAY: bold orange circle with a pulsing ring */
.day.today {
background: var(–accent);
color: #fff;
font-weight: 700;
border-radius: 50%;
box-shadow: 0 0 0 3px rgba(255,107,53,0.25), 0 0 12px rgba(255,107,53,0.4);
animation: pulse 2s ease-in-out infinite;
z-index: 1;
}

@keyframes pulse {
0%, 100% { box-shadow: 0 0 0 3px rgba(255,107,53,0.25), 0 0 12px rgba(255,107,53,0.35); }
50%       { box-shadow: 0 0 0 6px rgba(255,107,53,0.15), 0 0 20px rgba(255,107,53,0.5); }
}

.day.holiday { color: var(–holiday); }
.day.holiday::after {
content: ‘’;
position: absolute;
bottom: 1px;
left: 50%;
transform: translateX(-50%);
width: 2px; height: 2px;
border-radius: 50%;
background: var(–holiday);
}

.day.today.holiday { color: #fff; }
.day.today.holiday::after { display: none; }

.day[data-h]:hover::before {
content: attr(data-h);
position: absolute;
bottom: 110%;
left: 50%;
transform: translateX(-50%);
background: #222;
border: 1px solid var(–border);
color: var(–text);
font-size: 10px;
padding: 3px 8px;
border-radius: 4px;
white-space: nowrap;
z-index: 100;
pointer-events: none;
}

/* highlight the tile containing today */
.month-tile.has-today .month-header {
border-bottom-color: var(–accent);
}
.month-tile.has-today .month-name {
color: var(–accent);
}

.legend { display: flex; gap: 16px; margin-top: 20px; font-size: 11px; color: var(–muted); }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 6px; height: 6px; border-radius: 50%; }

@media (max-width: 600px) {
header { padding: 12px 16px; }
main { padding: 20px 16px 40px; }
}
</style>

</head>
<body>

<header>
  <span class="logo">Cal</span>

  <div class="ctrl-group">
    <span>From</span>
    <select id="startMonth">
      <option value="0">Jan</option><option value="1">Feb</option>
      <option value="2">Mar</option><option value="3">Apr</option>
      <option value="4">May</option><option value="5">Jun</option>
      <option value="6">Jul</option><option value="7">Aug</option>
      <option value="8">Sep</option><option value="9">Oct</option>
      <option value="10">Nov</option><option value="11">Dec</option>
    </select>
    <input type="number" id="startYear" value="2025" min="2000" max="2040">
  </div>

  <div class="ctrl-group">
    <span>To</span>
    <select id="endMonth">
      <option value="0">Jan</option><option value="1">Feb</option>
      <option value="2">Mar</option><option value="3">Apr</option>
      <option value="4">May</option><option value="5">Jun</option>
      <option value="6">Jul</option><option value="7">Aug</option>
      <option value="8">Sep</option><option value="9">Oct</option>
      <option value="10">Nov</option><option value="11" selected>Dec</option>
    </select>
    <input type="number" id="endYear" value="2026" min="2000" max="2040">
  </div>

  <div class="ctrl-group">
    <span>Width</span>
    <input type="range" id="tileWidth" min="180" max="360" value="360">
  </div>

  <div class="ctrl-group">
    <span>Holidays</span>
    <div class="country-flags" id="countryBtns"></div>
  </div>
</header>

<main id="calRoot"></main>

<script>
function easter(y) {
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4;
  const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4;
  const l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  return{m:Math.floor((h+l-7*m+114)/31)-1,d:((h+l-7*m+114)%31)+1};
}

function getHolidays(year, countries) {
  const map={};
  const add=(m,d,name)=>{
    const key=`${year}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(!map[key])map[key]=new Set(); map[key].add(name);
  };
  const e=easter(year);
  const eOff=(offset,name)=>{
    const b=new Date(year,e.m,e.d); b.setDate(b.getDate()+offset);
    add(b.getMonth(),b.getDate(),name);
  };

  if(countries.has('DE')){
    add(0,1,'New Year');add(4,0,'Labour Day');add(9,2,'German Unity Day');
    add(11,25,'Christmas');add(11,26,'2nd Christmas');
    eOff(-2,'Good Friday');eOff(0,'Easter');eOff(1,'Easter Monday');
    eOff(39,'Ascension');eOff(49,'Whit Sunday');eOff(50,'Whit Monday');
  }
  if(countries.has('AT')){
    add(0,1,'New Year');add(0,5,'Epiphany');add(4,0,'Labour Day');
    add(7,14,'Assumption');add(9,25,'National Day');add(10,0,'All Saints');
    add(11,7,'Immaculate Conception');add(11,25,'Christmas');add(11,26,'St Stephen');
    eOff(-2,'Good Friday');eOff(0,'Easter');eOff(1,'Easter Monday');
    eOff(39,'Ascension');eOff(49,'Whit Sunday');eOff(50,'Whit Monday');eOff(60,'Corpus Christi');
  }
  if(countries.has('US')){
    add(0,1,'New Year');add(0,nthWd(year,0,1,3),'MLK Day');
    add(1,nthWd(year,1,1,3),"Presidents' Day");add(4,lastWd(year,4,1),'Memorial Day');
    add(5,18,'Juneteenth');add(6,3,'Independence Day');
    add(8,nthWd(year,8,1,1),'Labor Day');add(10,nthWd(year,10,4,4),'Thanksgiving');
    add(11,25,'Christmas');
  }
  if(countries.has('GB')){
    add(0,1,'New Year');add(11,25,'Christmas');add(11,26,'Boxing Day');
    eOff(-2,'Good Friday');eOff(1,'Easter Monday');
    add(4,nthWd(year,4,1,1),'Early May BH');add(4,lastWd(year,4,1),'Spring BH');
    add(7,lastWd(year,7,1),'Summer BH');
  }
  if(countries.has('FR')){
    add(0,1,'New Year');add(4,0,'Labour Day');add(4,7,'Victory 1945');
    add(6,13,'Bastille Day');add(7,14,'Assumption');add(10,0,'All Saints');
    add(10,10,'Armistice');add(11,25,'Christmas');
    eOff(1,'Easter Monday');eOff(39,'Ascension');eOff(50,'Whit Monday');
  }
  if(countries.has('CN')){
    add(0,1,'New Year');add(4,0,'Labour Day');add(9,0,'National Day');
    add(9,1,'National Day');add(9,2,'National Day');
    // Spring Festival (Chinese New Year) - fixed dates per year
    const cny={2024:[1,10],2025:[1,29],2026:[2,17],2027:[2,6],2028:[1,26]};
    if(cny[year]){
      const [cm,cd]=cny[year];
      for(let i=0;i<7;i++){
        const dt=new Date(year,cm-1,cd+i);
        add(dt.getMonth(),dt.getDate(),'Spring Festival');
      }
    }
    add(3,4,'Qingming Festival');
    add(5,9,'Dragon Boat Festival');
    add(8,17,'Mid-Autumn Festival');
  }
  if(countries.has('JP')){
    add(0,1,'New Year');add(0,2,'New Year');add(0,3,'New Year');
    add(0,nthWd(year,0,1,2),'Coming of Age');
    add(1,11,'National Foundation Day');
    add(2,20,'Vernal Equinox');
    add(3,29,'Showa Day');
    add(4,3,'Constitution Day');add(4,4,'Greenery Day');add(4,5,"Children's Day");
    add(6,nthWd(year,6,1,3),'Marine Day');
    add(7,11,'Mountain Day');
    add(8,nthWd(year,8,1,3),'Respect for the Aged');
    add(8,23,'Autumnal Equinox');
    add(9,nthWd(year,9,1,2),'Sports Day');
    add(10,3,'Culture Day');add(10,23,'Labour Thanksgiving');
    add(11,23,'Emperor Birthday');
  }
  return map;
}

function nthWd(y,m,wd,n){let d=1,c=0;while(true){if(new Date(y,m,d).getDay()===wd){c++;if(c===n)return d;}d++;}}
function lastWd(y,m,wd){for(let d=new Date(y,m+1,0).getDate();d>=1;d--)if(new Date(y,m,d).getDay()===wd)return d;}
function isoWeek(date){
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));
  return Math.ceil((((d-new Date(Date.UTC(d.getUTCFullYear(),0,1)))/86400000)+1)/7);
}

const today=new Date();
const todayKey=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
const todayYear=today.getFullYear();
const todayMonth=today.getMonth();

const state={
  startYear:todayYear,
  startMonth:todayMonth,
  endYear:todayMonth>=6?todayYear+1:todayYear,
  endMonth:11,
  tileWidth:360,
  countries:new Set(['DE'])
};

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS=['Mo','Tu','We','Th','Fr','Sa','Su'];

function scrollToToday(){
  setTimeout(()=>{
    const el=document.querySelector('.month-tile.has-today');
    if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
  },50);
}

function render(){
  document.documentElement.style.setProperty('--tile-w',state.tileWidth+'px');
  const root=document.getElementById('calRoot');
  root.innerHTML='';
  const months=[];
  let y=state.startYear,m=state.startMonth;
  while(y<state.endYear||(y===state.endYear&&m<=state.endMonth)){months.push({y,m});m++;if(m>11){m=0;y++;}}
  const byYear={};
  months.forEach(({y,m})=>{if(!byYear[y])byYear[y]=[];byYear[y].push(m);});
  Object.entries(byYear).forEach(([year,mList])=>{
    const y=parseInt(year);
    const holidays=getHolidays(y,state.countries);
    const sec=document.createElement('div'); sec.className='year-section';
    const yl=document.createElement('div'); yl.className='year-label'; yl.textContent=year;
    sec.appendChild(yl);
    const row=document.createElement('div'); row.className='months-row';
    mList.forEach(m=>row.appendChild(buildTile(y,m,holidays)));
    sec.appendChild(row); root.appendChild(sec);
  });
  const leg=document.createElement('div'); leg.className='legend';
  leg.innerHTML=`
    <div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div>Today</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--holiday)"></div>Holiday</div>
  `;
  root.appendChild(leg);
  scrollToToday();
}

function buildTile(year,month,holidays){
  const tile=document.createElement('div'); tile.className='month-tile';
  const daysInMonth=new Date(year,month+1,0).getDate();
  const startDow=(new Date(year,month,1).getDay()+6)%7;

  // check if this tile contains today
  if(year===todayYear&&month===todayMonth) tile.classList.add('has-today');

  const hdr=document.createElement('div'); hdr.className='month-header';
  hdr.innerHTML=`<span class="month-name">${MONTHS[month]}</span><span class="month-num">${String(month+1).padStart(2,'0')}</span>`;
  tile.appendChild(hdr);

  const grid=document.createElement('div'); grid.className='day-grid';

  // header row: W + day names
  const wkHdrCell=document.createElement('div'); wkHdrCell.className='cell hdr wk-hdr'; wkHdrCell.textContent='W';
  grid.appendChild(wkHdrCell);
  DAYS.forEach(d=>{const h=document.createElement('div');h.className='cell hdr';h.textContent=d;grid.appendChild(h);});

  let dayNum=1,col=startDow;
  while(dayNum<=daysInMonth){
    if(col===0||dayNum===1){
      if(dayNum===1&&col>0){
        const wn=document.createElement('div');wn.className='cell week-num';wn.textContent=isoWeek(new Date(year,month,1));grid.appendChild(wn);
        for(let i=0;i<col;i++){const e=document.createElement('div');e.className='cell';grid.appendChild(e);}
      } else {
        const wn=document.createElement('div');wn.className='cell week-num';wn.textContent=isoWeek(new Date(year,month,dayNum));grid.appendChild(wn);
      }
    }
    const key=`${year}-${String(month+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
    const cell=document.createElement('div'); cell.className='cell day';
    if(col===5)cell.classList.add('sat');
    if(col===6)cell.classList.add('sun');
    if(key===todayKey)cell.classList.add('today');
    const hols=holidays[key];
    if(hols){cell.classList.add('holiday');cell.setAttribute('data-h',[...hols].join(' · '));}
    cell.textContent=dayNum;
    grid.appendChild(cell);
    col++;if(col===7)col=0;dayNum++;
  }
  if(col>0)for(let i=col;i<7;i++){const e=document.createElement('div');e.className='cell';grid.appendChild(e);}
  tile.appendChild(grid);
  return tile;
}

// Controls
const COUNTRIES=[
  {code:'DE',label:'🇩🇪 DE'},{code:'AT',label:'🇦🇹 AT'},
  {code:'US',label:'🇺🇸 US'},{code:'GB',label:'🇬🇧 GB'},
  {code:'FR',label:'🇫🇷 FR'},{code:'CN',label:'🇨🇳 CN'},
  {code:'JP',label:'🇯🇵 JP'},
];
COUNTRIES.forEach(({code,label})=>{
  const btn=document.createElement('button');
  btn.className='flag-btn'+(state.countries.has(code)?' active':'');
  btn.textContent=label;
  btn.addEventListener('click',()=>{
    state.countries.has(code)?state.countries.delete(code):state.countries.add(code);
    btn.classList.toggle('active'); render();
  });
  document.getElementById('countryBtns').appendChild(btn);
});

const sm=document.getElementById('startMonth'); sm.value=state.startMonth; sm.addEventListener('change',()=>{state.startMonth=parseInt(sm.value);render();scrollToToday();});
const em=document.getElementById('endMonth'); em.value=state.endMonth; em.addEventListener('change',()=>{state.endMonth=parseInt(em.value);render();scrollToToday();});
const sy=document.getElementById('startYear'); sy.value=state.startYear; sy.addEventListener('change',()=>{state.startYear=parseInt(sy.value);render();scrollToToday();});
const ey=document.getElementById('endYear'); ey.value=state.endYear; ey.addEventListener('change',()=>{state.endYear=parseInt(ey.value);render();scrollToToday();});
document.getElementById('tileWidth').addEventListener('input',e=>{
  state.tileWidth=parseInt(e.target.value);
  document.documentElement.style.setProperty('--tile-w',state.tileWidth+'px');
});

render();
</script>

</body>
</html>
