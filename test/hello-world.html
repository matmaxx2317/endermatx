<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello World</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

body {
background-color: #1a1a2e;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
font-family: ‘Courier New’, monospace;
image-rendering: pixelated;
overflow: hidden;
}

.sky {
position: fixed;
inset: 0;
background: linear-gradient(180deg, #1a6b8a 0%, #3a9bbf 40%, #87ceeb 70%, #c8e8f0 100%);
z-index: 0;
}

.stars {
position: fixed;
inset: 0;
z-index: 1;
}

.star {
position: absolute;
width: 4px;
height: 4px;
background: #fff;
}

.ground {
position: fixed;
bottom: 0;
left: 0;
right: 0;
height: 120px;
z-index: 2;
}

.ground-grass {
height: 32px;
background: #5a8a2a;
border-top: 4px solid #6abf2e;
}

.ground-dirt {
height: 88px;
background: #8B5A2B;
background-image:
repeating-linear-gradient(90deg, transparent, transparent 31px, #7a4e26 31px, #7a4e26 32px),
repeating-linear-gradient(0deg, transparent, transparent 31px, #7a4e26 31px, #7a4e26 32px);
}

.scene {
position: relative;
z-index: 10;
display: flex;
flex-direction: column;
align-items: center;
margin-bottom: 120px;
}

.sign-post {
width: 12px;
height: 80px;
background: #8B6914;
border-left: 2px solid #6b5010;
border-right: 2px solid #a07820;
}

.sign {
background: #c8a84b;
border: 4px solid #6b5010;
border-bottom: 6px solid #6b5010;
padding: 16px 24px;
box-shadow: 4px 4px 0 #3a2a08, inset 2px 2px 0 #d4b85a, inset -2px -2px 0 #a07820;
min-width: 280px;
text-align: center;
}

.sign h1 {
font-family: ‘Courier New’, monospace;
font-size: 28px;
font-weight: 900;
color: #2a1a00;
text-shadow: 2px 2px 0 #c8a84b, 3px 3px 0 #6b5010;
letter-spacing: 0.05em;
line-height: 1.2;
text-transform: uppercase;
}

.sign p {
font-family: ‘Courier New’, monospace;
font-size: 11px;
color: #4a3000;
margin-top: 8px;
letter-spacing: 0.1em;
text-transform: uppercase;
}

.creeper {
position: fixed;
bottom: 120px;
right: 40px;
z-index: 5;
animation: creeper-walk 8s ease-in-out infinite;
}

@keyframes creeper-walk {
0%, 100% { transform: translateX(0); }
50% { transform: translateX(-30px); }
}

.creeper-head {
width: 48px;
height: 48px;
background: #4a8a4a;
border: 3px solid #2a5a2a;
position: relative;
margin: 0 auto;
box-shadow: 2px 2px 0 #1a3a1a;
}

.creeper-eye {
position: absolute;
width: 10px;
height: 12px;
background: #1a1a1a;
}

.creeper-eye.left { top: 14px; left: 8px; }
.creeper-eye.right { top: 14px; right: 8px; }

.creeper-mouth {
position: absolute;
bottom: 8px;
left: 50%;
transform: translateX(-50%);
width: 24px;
height: 10px;
background: #1a1a1a;
clip-path: polygon(0 50%, 33% 50%, 33% 0, 66% 0, 66% 50%, 100% 50%, 100% 100%, 0 100%);
}

.creeper-body {
width: 36px;
height: 44px;
background: #4a8a4a;
border: 3px solid #2a5a2a;
margin: 0 auto;
box-shadow: 2px 2px 0 #1a3a1a;
}

.creeper-legs {
display: flex;
justify-content: center;
gap: 4px;
}

.creeper-leg {
width: 14px;
height: 28px;
background: #4a8a4a;
border: 3px solid #2a5a2a;
box-shadow: 2px 2px 0 #1a3a1a;
animation: leg-swing 0.6s ease-in-out infinite alternate;
}

.creeper-leg:nth-child(2) { animation-delay: 0.3s; }

@keyframes leg-swing {
from { transform: skewX(-5deg); }
to { transform: skewX(5deg); }
}

.clouds {
position: fixed;
top: 60px;
z-index: 3;
width: 100%;
}

.cloud {
position: absolute;
height: 24px;
background: white;
opacity: 0.9;
animation: cloud-move linear infinite;
}

.cloud-1 { width: 80px; top: 0; animation-duration: 30s; animation-delay: 0s; left: -100px; }
.cloud-2 { width: 60px; top: 30px; animation-duration: 45s; animation-delay: -15s; left: -100px; }
.cloud-3 { width: 100px; top: 10px; animation-duration: 38s; animation-delay: -8s; left: -100px; }

@keyframes cloud-move {
from { transform: translateX(-150px); }
to { transform: translateX(110vw); }
}

.torch {
position: fixed;
bottom: 152px;
left: 60px;
z-index: 5;
}

.torch-stick {
width: 8px;
height: 24px;
background: #8B5A2B;
margin: 0 auto;
border: 2px solid #6b4010;
}

.torch-flame {
width: 12px;
height: 12px;
background: #ff9900;
margin: 0 auto -2px;
border-radius: 50% 50% 20% 20%;
animation: flicker 0.3s ease-in-out infinite alternate;
box-shadow: 0 0 8px #ff6600, 0 0 16px #ff9900;
}

@keyframes flicker {
from { transform: scaleX(1) scaleY(1); background: #ff9900; }
to { transform: scaleX(0.85) scaleY(1.15); background: #ffcc00; }
}

.pixel-border {
position: fixed;
inset: 0;
z-index: 20;
pointer-events: none;
border: 8px solid #2a1a00;
box-shadow: inset 0 0 0 4px #8B6914;
}
</style>

</head>
<body>

<div class="sky"></div>
<div class="stars" id="stars"></div>

<div class="clouds">
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
</div>

<div class="scene">
  <div class="sign">
    <h1>Hello<br>World</h1>
    <p>Endermatx v2.0</p>
  </div>
  <div class="sign-post"></div>
</div>

<div class="torch">
  <div class="torch-flame"></div>
  <div class="torch-stick"></div>
</div>

<div class="creeper">
  <div class="creeper-head">
    <div class="creeper-eye left"></div>
    <div class="creeper-eye right"></div>
    <div class="creeper-mouth"></div>
  </div>
  <div class="creeper-body"></div>
  <div class="creeper-legs">
    <div class="creeper-leg"></div>
    <div class="creeper-leg"></div>
  </div>
</div>

<div class="ground">
  <div class="ground-grass"></div>
  <div class="ground-dirt"></div>
</div>

<div class="pixel-border"></div>

<script>
  const stars = document.getElementById('stars');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 50 + '%';
    s.style.opacity = Math.random() * 0.6 + 0.2;
    stars.appendChild(s);
  }
</script>

</body>
</html>
