<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

body {
background: #0e0e0e;
color: #e8e8e8;
font-family: ‘Courier New’, Courier, monospace;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
padding: 32px 16px 80px;
}

h1 {
font-size: 10px;
letter-spacing: 0.3em;
text-transform: uppercase;
color: #444;
margin-bottom: 32px;
}

.top-bar {
display: flex;
align-items: center;
gap: 16px;
margin-bottom: 24px;
}

.timer-display {
font-size: clamp(36px, 10vw, 64px);
font-weight: 700;
letter-spacing: -0.02em;
color: #333;
font-variant-numeric: tabular-nums;
line-height: 1;
transition: color 0.3s;
}

.timer-display.running { color: #f0f0f0; }

.btn-control {
padding: 10px 22px;
border: 1px solid #2a2a2a;
background: #141414;
color: #888;
font-size: 10px;
letter-spacing: 0.2em;
text-transform: uppercase;
cursor: pointer;
font-family: inherit;
transition: all 0.15s;
white-space: nowrap;
}

.btn-control.start:hover {
border-color: #7effa0;
color: #7effa0;
background: #0d1a10;
}

.btn-control.stop {
border-color: #ff6b6b;
color: #ff6b6b;
background: #1a0e0e;
}

.btn-control.stop:hover { background: #220e0e; }

.active-indicator {
font-size: 11px;
letter-spacing: 0.1em;
color: #444;
margin-bottom: 24px;
min-height: 16px;
text-align: center;
}

.active-indicator.live { color: #7effa0; }

.active-dot {
display: inline-block;
width: 6px;
height: 6px;
border-radius: 50%;
background: #7effa0;
margin-right: 6px;
vertical-align: middle;
animation: pulse 1.4s ease-in-out infinite;
}

@keyframes pulse {
0%, 100% { opacity: 1; }
50% { opacity: 0.3; }
}

.projects-grid {
width: 100%;
max-width: 560px;
display: grid;
grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
gap: 8px;
margin-bottom: 40px;
}

.proj-btn {
position: relative;
padding: 14px 12px 12px;
border: 1px solid #222;
background: #141414;
color: #bbb;
font-family: inherit;
cursor: pointer;
text-align: left;
transition: border-color 0.15s, background 0.15s;
min-height: 72px;
display: flex;
flex-direction: column;
justify-content: space-between;
overflow: hidden;
}

.proj-btn:hover:not(.inactive) {
border-color: #3a3a3a;
background: #1a1a1a;
}

.proj-btn.inactive { cursor: default; opacity: 0.35; }

.proj-btn.active-project { background: #141414; }

.proj-btn-bar {
position: absolute;
top: 0;
left: 0;
width: 3px;
height: 100%;
}

.proj-btn-now {
position: absolute;
top: 6px;
right: 8px;
font-size: 9px;
letter-spacing: 0.15em;
color: #7effa0;
opacity: 0;
transition: opacity 0.2s;
}

.proj-btn.active-project .proj-btn-now { opacity: 1; }

.proj-btn-name {
font-size: 13px;
color: #f0f0f0;
padding-left: 8px;
line-height: 1.3;
word-break: break-word;
}

.proj-btn.active-project .proj-btn-name { color: #fff; }

.proj-btn-time {
font-size: 11px;
color: #444;
padding-left: 8px;
font-variant-numeric: tabular-nums;
margin-top: 8px;
min-height: 14px;
}

.proj-btn.active-project .proj-btn-time { color: #7effa0; }

.section {
width: 100%;
max-width: 560px;
margin-top: 40px;
}

.section-title {
font-size: 10px;
letter-spacing: 0.25em;
text-transform: uppercase;
color: #3a3a3a;
margin-bottom: 14px;
}

.log-entry {
display: flex;
align-items: center;
gap: 10px;
padding: 10px 0;
border-bottom: 1px solid #181818;
}

.log-dot {
width: 7px;
height: 7px;
border-radius: 50%;
flex-shrink: 0;
}

.log-info { flex: 1; }
.log-project { font-size: 13px; color: #f0f0f0; }
.log-meta { font-size: 11px; color: #333; margin-top: 2px; }

.log-duration {
font-size: 12px;
color: #555;
font-variant-numeric: tabular-nums;
white-space: nowrap;
}

.log-delete {
background: none;
border: none;
color: #2a2a2a;
cursor: pointer;
font-size: 16px;
padding: 2px 6px;
transition: color 0.15s;
font-family: inherit;
}

.log-delete:hover { color: #ff6b6b; }

.report-tabs {
display: flex;
gap: 2px;
margin-bottom: 14px;
}

.report-tab {
flex: 1;
padding: 8px;
text-align: center;
font-size: 10px;
letter-spacing: 0.12em;
text-transform: uppercase;
cursor: pointer;
border: 1px solid #1e1e1e;
color: #444;
background: none;
font-family: inherit;
transition: all 0.15s;
}

.report-tab.active {
border-color: #7effa0;
color: #7effa0;
background: #0d1a10;
}

.report-row {
display: flex;
align-items: center;
gap: 10px;
padding: 9px 0;
border-bottom: 1px solid #181818;
}

.report-label {
font-size: 12px;
color: #d0d0d0;
width: 110px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
flex-shrink: 0;
}

.report-bar-wrap {
flex: 1;
height: 3px;
background: #1e1e1e;
}

.report-bar { height: 3px; transition: width 0.4s ease; }

.report-time {
font-size: 11px;
color: #555;
width: 44px;
text-align: right;
font-variant-numeric: tabular-nums;
flex-shrink: 0;
}

.report-total {
font-size: 11px;
color: #333;
letter-spacing: 0.1em;
text-align: right;
margin-top: 10px;
}

.proj-item {
display: flex;
align-items: center;
gap: 10px;
padding: 9px 0;
border-bottom: 1px solid #181818;
}

.proj-color-dot {
width: 12px;
height: 12px;
border-radius: 50%;
flex-shrink: 0;
cursor: pointer;
border: 2px solid transparent;
transition: border-color 0.15s;
}

.proj-color-dot:hover { border-color: #555; }

.proj-name-input {
flex: 1;
background: none;
border: none;
color: #f0f0f0;
font-size: 13px;
font-family: inherit;
outline: none;
border-bottom: 1px solid transparent;
padding: 2px 0;
transition: border-color 0.15s;
}

.proj-name-input:focus { border-bottom-color: #7effa0; }

.proj-delete {
background: none;
border: none;
color: #2a2a2a;
cursor: pointer;
font-size: 16px;
padding: 2px 6px;
transition: color 0.15s;
font-family: inherit;
}

.proj-delete:hover { color: #ff6b6b; }

.add-row {
display: flex;
gap: 8px;
margin-top: 12px;
}

.add-input {
flex: 1;
background: #141414;
border: 1px solid #1e1e1e;
color: #ddd;
font-size: 13px;
font-family: inherit;
padding: 8px 12px;
outline: none;
transition: border-color 0.15s;
}

.add-input:focus { border-color: #7effa0; }

.add-btn {
background: #141414;
border: 1px solid #2a2a2a;
color: #7effa0;
font-size: 18px;
padding: 8px 16px;
cursor: pointer;
transition: all 0.15s;
font-family: inherit;
}

.add-btn:hover { background: #0d1a10; border-color: #7effa0; }

.color-popup {
display: none;
position: fixed;
background: #1a1a1a;
border: 1px solid #333;
padding: 10px;
gap: 8px;
flex-wrap: wrap;
width: 130px;
z-index: 200;
}

.color-popup.visible { display: flex; }

.color-swatch {
width: 22px;
height: 22px;
border-radius: 50%;
cursor: pointer;
border: 2px solid transparent;
transition: transform 0.1s, border-color 0.1s;
}

.color-swatch:hover { transform: scale(1.2); border-color: #fff; }

.empty-state {
font-size: 12px;
color: #2e2e2e;
text-align: center;
padding: 20px 0;
letter-spacing: 0.05em;
}
</style>

</head>
<body>

<h1>Time Tracker</h1>

<div class="top-bar">
  <div class="timer-display" id="timerDisplay">00:00:00</div>
  <button class="btn-control start" id="btnControl" onclick="toggleTimer()">START</button>
</div>

<div class="active-indicator" id="activeIndicator">&#8212;</div>

<div class="projects-grid" id="projectsGrid"></div>

<div class="color-popup" id="colorPopup"></div>

<div class="section">
  <div class="section-title">Today's Log</div>
  <div id="logList"></div>
</div>

<div class="section">
  <div class="section-title">Report</div>
  <div class="report-tabs">
    <button class="report-tab active" onclick="setReport('week')">This Week</button>
    <button class="report-tab" onclick="setReport('month')">This Month</button>
    <button class="report-tab" onclick="setReport('all')">All Time</button>
  </div>
  <div id="reportContent"></div>
</div>

<div class="section">
  <div class="section-title">Projects</div>
  <div id="projectsMgr"></div>
  <div class="add-row">
    <input class="add-input" id="newProjName" placeholder="New project name..."
      onkeydown="if(event.key==='Enter')addProject()">
    <button class="add-btn" onclick="addProject()">+</button>
  </div>
</div>

<script>
const COLORS = [
  '#7effa0','#ff6b6b','#6bb5ff','#ffd56b','#d06bff',
  '#ff9f6b','#6bfff0','#ff6bd6','#b5ff6b','#6b7fff'
];

let state = {
  projects: [],
  entries: [],
  timerRunning: false,
  timerStart: null,
  activeProjectId: null,
  activeSegmentStart: null,
  reportMode: 'week'
};

let tickInterval = null;

function loadState() {
  try {
    const s = localStorage.getItem('tt2_state');
    if (s) state = Object.assign(state, JSON.parse(s));
  } catch(e) {}
}

function saveState() {
  localStorage.setItem('tt2_state', JSON.stringify(state));
}

function toggleTimer() {
  if (state.timerRunning) stopAll(); else startAll();
}

function startAll() {
  state.timerRunning = true;
  state.timerStart = Date.now();
  state.activeProjectId = null;
  state.activeSegmentStart = null;
  saveState();
  updateControlBtn();
  updateIndicator();
  tickInterval = setInterval(tick, 1000);
  tick();
  renderGrid();
}

function stopAll() {
  flushSegment();
  state.timerRunning = false;
  state.timerStart = null;
  state.activeProjectId = null;
  state.activeSegmentStart = null;
  clearInterval(tickInterval);
  tickInterval = null;
  saveState();
  updateControlBtn();
  updateIndicator();
  document.getElementById('timerDisplay').classList.remove('running');
  document.getElementById('timerDisplay').textContent = '00:00:00';
  renderGrid();
  renderLog();
  renderReport();
}

function selectProject(id) {
  if (!state.timerRunning) return;
  if (state.activeProjectId === id) return;
  flushSegment();
  state.activeProjectId = id;
  state.activeSegmentStart = Date.now();
  saveState();
  updateIndicator();
  renderGrid();
}

function flushSegment() {
  if (state.activeProjectId && state.activeSegmentStart) {
    const dur = Math.floor((Date.now() - state.activeSegmentStart) / 1000);
    if (dur >= 2) {
      state.entries.push({
        id: Date.now() + Math.random(),
        projectId: state.activeProjectId,
        start: state.activeSegmentStart,
        duration: dur
      });
    }
  }
}

function tick() {
  if (!state.timerStart) return;
  const elapsed = Math.floor((Date.now() - state.timerStart) / 1000);
  const el = document.getElementById('timerDisplay');
  el.textContent = formatDuration(elapsed);
  el.classList.add('running');
  updateGridTimes();
}

function updateControlBtn() {
  const btn = document.getElementById('btnControl');
  if (state.timerRunning) {
    btn.textContent = 'STOP';
    btn.classList.remove('start');
    btn.classList.add('stop');
  } else {
    btn.textContent = 'START';
    btn.classList.remove('stop');
    btn.classList.add('start');
  }
}

function updateIndicator() {
  const el = document.getElementById('activeIndicator');
  if (!state.timerRunning) {
    el.innerHTML = '&#8212;';
    el.classList.remove('live');
    return;
  }
  if (!state.activeProjectId) {
    el.innerHTML = 'Select a project to start tracking';
    el.classList.remove('live');
    return;
  }
  const p = getProject(state.activeProjectId);
  el.innerHTML = '<span class="active-dot"></span>' + escHtml(p.name);
  el.classList.add('live');
}

function sortedProjects() {
  return state.projects.slice().sort(function(a, b) {
    return a.name.localeCompare(b.name);
  });
}

function renderGrid() {
  const grid = document.getElementById('projectsGrid');
  if (state.projects.length === 0) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">Add projects below to get started.</div>';
    return;
  }
  grid.innerHTML = sortedProjects().map(p => {
    const isActive = state.timerRunning && state.activeProjectId === p.id;
    const isInactive = !state.timerRunning;
    const total = getProjectTotal(p.id);
    const timeStr = total > 0 ? formatDurationShort(total) : '';
    const borderStyle = isActive ? 'border-color:' + p.color + ';' : '';
    return '<button class="proj-btn' + (isActive ? ' active-project' : '') + (isInactive ? ' inactive' : '') +
      '" style="' + borderStyle + '" onclick="selectProject(' + p.id + ')" id="pgrid_' + p.id + '">' +
      '<div class="proj-btn-bar" style="background:' + p.color + '"></div>' +
      '<span class="proj-btn-now">NOW</span>' +
      '<div class="proj-btn-name">' + escHtml(p.name) + '</div>' +
      '<div class="proj-btn-time" id="pgtime_' + p.id + '">' + timeStr + '</div>' +
      '</button>';
  }).join('');
}

function updateGridTimes() {
  state.projects.forEach(p => {
    const el = document.getElementById('pgtime_' + p.id);
    if (!el) return;
    const total = getProjectTotal(p.id);
    el.textContent = total > 0 ? formatDurationShort(total) : '';
  });
}

function getProjectTotal(id) {
  let total = state.entries
    .filter(e => e.projectId === id)
    .reduce((s, e) => s + e.duration, 0);
  if (state.timerRunning && state.activeProjectId === id && state.activeSegmentStart) {
    total += Math.floor((Date.now() - state.activeSegmentStart) / 1000);
  }
  return total;
}

function isToday(ts) {
  const d = new Date(ts), n = new Date();
  return d.getFullYear() === n.getFullYear() &&
         d.getMonth() === n.getMonth() &&
         d.getDate() === n.getDate();
}

function renderLog() {
  const list = document.getElementById('logList');
  const today = state.entries.filter(e => isToday(e.start)).slice().reverse();
  if (today.length === 0) {
    list.innerHTML = '<div class="empty-state">No entries today yet.</div>';
    return;
  }
  list.innerHTML = today.map(e => {
    const p = getProject(e.projectId);
    return '<div class="log-entry">' +
      '<div class="log-dot" style="background:' + p.color + '"></div>' +
      '<div class="log-info"><div class="log-project">' + escHtml(p.name) + '</div>' +
      '<div class="log-meta">' + formatTime(e.start) + '</div></div>' +
      '<div class="log-duration">' + formatDurationShort(e.duration) + '</div>' +
      '<button class="log-delete" onclick="deleteEntry(' + e.id + ')">&#215;</button>' +
      '</div>';
  }).join('');
}

function deleteEntry(id) {
  state.entries = state.entries.filter(e => e.id !== id);
  saveState();
  renderLog();
  renderReport();
}

function setReport(mode) {
  state.reportMode = mode;
  saveState();
  document.querySelectorAll('.report-tab').forEach((t, i) => {
    t.classList.toggle('active', ['week','month','all'][i] === mode);
  });
  renderReport();
}

function getReportStart() {
  const now = new Date();
  if (state.reportMode === 'week') {
    const d = new Date(now);
    const day = d.getDay() || 7;
    d.setDate(d.getDate() - day + 1);
    d.setHours(0,0,0,0);
    return d.getTime();
  }
  if (state.reportMode === 'month') {
    return new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  }
  return 0;
}

function renderReport() {
  const start = getReportStart();
  const filtered = state.entries.filter(e => e.start >= start);
  const content = document.getElementById('reportContent');
  if (filtered.length === 0) {
    content.innerHTML = '<div class="empty-state">No entries in this period.</div>';
    return;
  }
  const totals = {};
  let grand = 0;
  filtered.forEach(e => {
    totals[e.projectId] = (totals[e.projectId] || 0) + e.duration;
    grand += e.duration;
  });
  const sorted = Object.entries(totals).sort((a,b) => b[1]-a[1]);
  const max = sorted[0][1];
  content.innerHTML = sorted.map(function(entry) {
    const pid = entry[0], dur = entry[1];
    const p = getProject(parseInt(pid));
    const pct = Math.round((dur / max) * 100);
    return '<div class="report-row">' +
      '<div class="report-label">' + escHtml(p.name) + '</div>' +
      '<div class="report-bar-wrap"><div class="report-bar" style="width:' + pct + '%;background:' + p.color + '"></div></div>' +
      '<div class="report-time">' + formatDurationShort(dur) + '</div>' +
      '</div>';
  }).join('') + '<div class="report-total">Total: ' + formatDurationShort(grand) + '</div>';
}

function renderProjectsMgr() {
  const list = document.getElementById('projectsMgr');
  if (state.projects.length === 0) {
    list.innerHTML = '<div class="empty-state">No projects yet.</div>';
    return;
  }
  list.innerHTML = sortedProjects().map(p =>
    '<div class="proj-item">' +
    '<div class="proj-color-dot" style="background:' + p.color + '" onclick="openColorPicker(' + p.id + ',this)"></div>' +
    '<input class="proj-name-input" value="' + escHtml(p.name) + '" onblur="renameProject(' + p.id + ',this.value)" onkeydown="if(event.key===\'Enter\')this.blur()">' +
    '<button class="proj-delete" onclick="deleteProject(' + p.id + ')">&#215;</button>' +
    '</div>'
  ).join('');
}

function addProject() {
  const input = document.getElementById('newProjName');
  const name = input.value.trim();
  if (!name) return;
  const newP = { id: Date.now(), name, color: COLORS[state.projects.length % COLORS.length] };
  state.projects.push(newP);
  state.projects.sort(function(a, b) { return a.name.localeCompare(b.name); });
  input.value = '';
  saveState();
  renderProjectsMgr();
  renderGrid();
}

function renameProject(id, name) {
  const p = state.projects.find(p => p.id === id);
  if (p && name.trim()) {
    p.name = name.trim();
    state.projects.sort(function(a, b) { return a.name.localeCompare(b.name); });
    saveState(); renderGrid(); renderLog(); renderReport();
  }
}

function deleteProject(id) {
  state.projects = state.projects.filter(p => p.id !== id);
  saveState();
  renderProjectsMgr();
  renderGrid();
  renderLog();
  renderReport();
}

function openColorPicker(id, dotEl) {
  closeColorPicker();
  const popup = document.getElementById('colorPopup');
  popup.innerHTML = COLORS.map(c =>
    '<div class="color-swatch" style="background:' + c + '" onclick="setColor(' + id + ',\'' + c + '\')"></div>'
  ).join('');
  const rect = dotEl.getBoundingClientRect();
  popup.style.left = rect.left + 'px';
  popup.style.top = (rect.bottom + 6) + 'px';
  popup.classList.add('visible');
}

function setColor(id, color) {
  const p = state.projects.find(p => p.id === id);
  if (p) { p.color = color; saveState(); renderProjectsMgr(); renderGrid(); renderLog(); renderReport(); }
  closeColorPicker();
}

function closeColorPicker() {
  document.getElementById('colorPopup').classList.remove('visible');
}

document.addEventListener('click', function(e) {
  if (!e.target.classList.contains('proj-color-dot') &&
      !e.target.classList.contains('color-swatch')) closeColorPicker();
});

function getProject(id) {
  return state.projects.find(p => p.id === id) || { name: 'Deleted', color: '#444' };
}

function formatDuration(s) {
  return pad(Math.floor(s/3600)) + ':' + pad(Math.floor((s%3600)/60)) + ':' + pad(s%60);
}

function formatDurationShort(s) {
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  if (h > 0) return h + 'h ' + pad(m) + 'm';
  if (m > 0) return m + 'm ' + pad(s%60) + 's';
  return s + 's';
}

function pad(n) { return n < 10 ? '0'+n : ''+n; }

function formatTime(ts) {
  const d = new Date(ts);
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function resumeIfRunning() {
  if (state.timerRunning && state.timerStart) {
    updateControlBtn();
    updateIndicator();
    tickInterval = setInterval(tick, 1000);
    tick();
  }
}

loadState();
if (state.projects.length === 0) {
  const defaults = [
    'VIO1208','VIO1254','VIO1406','VIO1508','VIO5404',
    'VX1152','VX1161.02','VX1161.22','VX1161.33','VX1161.52'
  ];
  defaults.forEach(function(name, i) {
    state.projects.push({ id: Date.now() + i, name: name, color: COLORS[i % COLORS.length] });
  });
  saveState();
}
renderGrid();
renderLog();
renderReport();
renderProjectsMgr();
updateControlBtn();
updateIndicator();
resumeIfRunning();
</script>

</body>
</html>
